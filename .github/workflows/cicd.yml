name: CI/CD - Build, Push & Deploy Flask App

on:
  push:
    branches: ["main"]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: flask-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}

    steps:
    # 1. Checkout
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. AWS Credentials
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # 3. Login to ECR
    - name: Login to ECR
      id: login-ecr
      run: |
        aws ecr get-login-password --region $AWS_REGION \
        | docker login --username AWS --password-stdin 414444871239.dkr.ecr.$AWS_REGION.amazonaws.com

    # 4. Build image
    - name: Build Docker image
      id: build
      run: |
        docker build -t $ECR_REPOSITORY:$IMAGE_TAG ./app
        echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

    # 5. Test container
    - name: Test container
      run: |
        docker run -d -p 5000:5000 --name test-container $ECR_REPOSITORY:$IMAGE_TAG
        sleep 5
        curl -f http://localhost:5000/health || exit 1
        docker rm -f test-container

    # 6. Tag & Push
    - name: Push to ECR
      run: |
        docker tag $ECR_REPOSITORY:$IMAGE_TAG 414444871239.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG
        docker push 414444871239.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::414444871239:role/github-actions-role
        aws-region: us-east-1

    - name: Verify AWS identity
      run: aws sts get-caller-identity

    - name: Deploy via SSM
      run: |
        aws ssm send-command \
          --targets "Key=tag:Role,Values=flask-server" \
          --document-name "AWS-RunShellScript" \
          --parameters commands="[ \
          \"aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 414444871239.dkr.ecr.us-east-1.amazonaws.com\", \
          \"docker pull 414444871239.dkr.ecr.us-east-1.amazonaws.com/$ECR_REPOSITORY:${{ needs.build-and-push.outputs.image_tag }}\", \
          \"docker rm -f flask || true\", \
          \"DB_HOST=\$(aws ssm get-parameter --name '/app/db/host' --query 'Parameter.Value' --output text)\", \
          \"DB_PASS=\$(aws ssm get-parameter --name '/app/db/password' --with-decryption --query 'Parameter.Value' --output text)\", \
          \"docker run -d -p 80:5000 --name flask -e DB_HOST=\$DB_HOST -e DB_PASS=\$DB_PASS 414444871239.dkr.ecr.us-east-1.amazonaws.com/$ECR_REPOSITORY:${{ needs.build-and-push.outputs.image_tag }}\" \
          ]"